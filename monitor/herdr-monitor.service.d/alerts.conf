# Instalar en: /etc/systemd/system/herdr-monitor.service.d/alerts.conf
# y luego: systemctl daemon-reload && systemctl restart herdr-monitor
#
# Umbrales endurecidos tras el freeze del host del 21/09/2026
# (RAM 90% + PSI-IO 91 + load15 136, máquina inmanejable hasta hard reboot).
# Ver RUNBOOK.md, sección "Hardening del host contra OOM/freeze".
[Service]
Environment=TH_MEM_PCT=80
Environment=ALERT_STRIKES=2
Environment=TH_LOAD15=16
# Swap residual alto sin PSI es inocuo (el kernel no lo reclama hasta tocarlo);
# con 50% alertaba en spam cada 30min durante días. Solo importa si se llena.
Environment=TH_SWAP_PCT=80
